    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Share+Tech+Mono&display=swap');

      #pw-gate {
        position: fixed; inset: 0; z-index: 99999;
        background: #03080f;
        display: flex; align-items: center; justify-content: center;
        font-family: 'Share Tech Mono', monospace;
      }
      #pw-gate::before {
        content: ''; position: absolute; inset: 0;
        background: repeating-linear-gradient(
          0deg, transparent, transparent 2px,
          rgba(30,120,255,0.025) 2px, rgba(30,120,255,0.025) 4px
        );
        pointer-events: none;
      }
      .pw-box {
        position: relative; display: flex; flex-direction: column;
        align-items: center; gap: 24px; padding: 52px 48px 44px;
        border: 1px solid rgba(30,120,255,0.3);
        background: rgba(3,15,35,0.92);
        box-shadow: 0 0 70px rgba(30,120,255,0.1), inset 0 0 40px rgba(0,0,0,0.7);
        animation: fadeIn 0.5s ease forwards;
      }
      .pw-box::before, .pw-box::after {
        content: ''; position: absolute; width: 12px; height: 12px;
        border-color: #1e78ff; border-style: solid;
      }
      .pw-box::before { top:-1px; left:-1px; border-width: 2px 0 0 2px; }
      .pw-box::after  { bottom:-1px; right:-1px; border-width: 0 2px 2px 0; }
      .pw-title {
        font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 22px;
        letter-spacing: 0.18em; color: #4da3ff;
        text-shadow: 0 0 20px rgba(30,120,255,0.7);
        text-transform: uppercase; text-align: center;
      }
      .pw-sub {
        font-size: 11px; letter-spacing: 0.12em;
        color: rgba(77,163,255,0.45); text-transform: uppercase; margin-top: -14px;
      }
      #pw-input {
        width: 240px; box-sizing: border-box;
        background: rgba(30,120,255,0.06); border: 1px solid rgba(30,120,255,0.4);
        color: #4da3ff; font-family: 'Orbitron', sans-serif;
        font-size: 20px; font-weight: 600; letter-spacing: 0.25em;
        text-align: center; padding: 14px 16px; outline: none;
        transition: border-color 0.2s, box-shadow 0.2s; caret-color: #4da3ff;
      }
      #pw-input:focus { border-color: #4da3ff; box-shadow: 0 0 22px rgba(30,120,255,0.25); }
      #pw-input.shake {
        animation: shake 0.4s ease;
        border-color: #ff3c5a; box-shadow: 0 0 22px rgba(255,60,90,0.35);
      }
      #pw-btn {
        width: 240px; padding: 14px; background: transparent;
        border: 1px solid #1e78ff; color: #4da3ff;
        font-family: 'Orbitron', sans-serif; font-size: 12px;
        font-weight: 600; letter-spacing: 0.25em; text-transform: uppercase;
        cursor: pointer; transition: background 0.2s, box-shadow 0.2s;
      }
      #pw-btn:hover { background: rgba(30,120,255,0.12); box-shadow: 0 0 24px rgba(30,120,255,0.3); }
      #pw-btn:active { background: rgba(30,120,255,0.22); }
      #pw-msg {
        font-size: 12px; letter-spacing: 0.1em; min-height: 16px;
        color: #ff3c5a; text-transform: uppercase;
        text-shadow: 0 0 10px rgba(255,60,90,0.5); text-align: center;
      }
      #pw-gate.unlocked { animation: fadeOut 0.5s ease forwards; pointer-events: none; }
      @keyframes fadeIn  { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
      @keyframes fadeOut { from { opacity:1; } to { opacity:0; } }
      @keyframes shake {
        0%,100% { transform:translateX(0); } 20% { transform:translateX(-8px); }
        40% { transform:translateX(8px); }   60% { transform:translateX(-5px); }
        80% { transform:translateX(5px); }
      }
    </style>

  <body>
    <div id="listLink" style="width: 100%; text-align: center; position: absolute; top: 0px; z-index: 999; background: rgb(119, 119, 255); opacity: 0.8;">
      <ul style="color: #ffffff; padding: 0px; margin: 0px; font-size: 20px;">
          <li style="padding: 5px; display: inline-block; float: left;">
            <a href="" style="color: #ffffff; text-decoration: none;">Bitlife</a>
          </li>
          <li style="padding: 5px; display: inline-block; float: right;">
            <a onclick="return closeBacklinks();" style="color: #ffffff; text-decoration: none;">❌</a>
          </li>
      </ul>
    </div>

    <div class="webgl-content">
      <div id="gameContainer" style="width: 100%; height: 100%;"></div>
    </div>

    <!-- Password Gate -->
    <div id="pw-gate">
      <div class="pw-box">
        <div class="pw-title">Access Required</div>
        <div class="pw-sub">Enter password to continue</div>
        <input id="pw-input" type="password" maxlength="10" placeholder="——" autocomplete="off" />
        <button id="pw-btn">Unlock</button>
        <div id="pw-msg"></div>
      </div>
    </div>

    <script>
      function closeBacklinks(){
        document.querySelector('#listLink').style.display = "none";
      }

      (function () {
        const gate    = document.getElementById('pw-gate');
        const input   = document.getElementById('pw-input');
        const btn     = document.getElementById('pw-btn');
        const msg     = document.getElementById('pw-msg');
        const CORRECT = '1025';

        function attempt() {
          if (input.value === CORRECT) {
            gate.classList.add('unlocked');
            setTimeout(() => gate.remove(), 500);
          } else {
            msg.textContent = 'Wrong password. Try again.';
            input.classList.remove('shake');
            void input.offsetWidth;
            input.classList.add('shake');
            input.value = '';
            input.addEventListener('animationend', () => input.classList.remove('shake'), { once: true });
          }
        }

        btn.addEventListener('click', attempt);
        input.addEventListener('keydown', (e) => { if (e.key === 'Enter') attempt(); });
        input.focus();
      })();
    </script>
